name: Deploy

# Cloudflare Pages へ Direct Upload でデプロイする。
# Cloudflare 側は Git 連携していないため、デプロイの起点はこのワークフローだけ。
#
# 定期実行を入れているのは、トップに出しているブログの最新記事を
# ビルド時に RSS から取っているため。push だけを起点にすると、記事を
# 書いてもこちらは古いままになる。

on:
  push:
    branches: [main]
  # 毎日 09:00 JST（cron は UTC）。ブログを書いた翌朝には反映される
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 連続 push でデプロイが競合しないよう、常に最新の 1 本だけ走らせる
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # ビルド中に blog.kazuki.page/rss.xml を取りに行く。
      # 失敗しても記事セクションが消えるだけでビルドは通る（src/lib/blog-posts.ts）
      - name: ビルド
        run: npm run build

      - name: Cloudflare Pages へデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=kazuki-page --branch=main
